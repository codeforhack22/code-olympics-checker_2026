<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Code Olympics 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 20px
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .3)
        }

        header {
            background: #2d3748;
            color: #fff;
            padding: 30px;
            text-align: center;
            border-radius: 12px 12px 0 0
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px
        }

        main {
            padding: 30px
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px
        }

        @media(max-width:768px) {
            .grid {
                grid-template-columns: 1fr
            }
        }

        .section {
            background: #f7fafc;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #e2e8f0
        }

        .section h2 {
            color: #2d3748;
            margin-bottom: 15px
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #cbd5e0;
            border-radius: 6px
        }

        input:focus,
        select:focus {
            outline: 0;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, .1)
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px
        }

        label {
            display: block;
            color: #4a5568;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: .9em
        }

        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #cbd5e0;
            border-radius: 6px;
            background: #fff
        }

        button {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: #fff;
            border: 0;
            border-radius: 6px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all .3s
        }

        button:hover {
            background: #5a67d8;
            transform: translateY(-2px)
        }

        button:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none
        }

        .result-item {
            background: #fff;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 4px solid #cbd5e0
        }

        .result-item.pass {
            border-left-color: #48bb78;
            background: #f0fff4
        }

        .result-item.fail {
            border-left-color: #f56565;
            background: #fff5f5
        }

        .result-item.unverified {
            border-left-color: #f6ad55;
            background: #fffaf0
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px
        }

        .result-title {
            font-weight: 600;
            color: #2d3748
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: .85em;
            font-weight: 600
        }

        .badge.pass {
            background: #48bb78;
            color: #fff
        }

        .badge.fail {
            background: #f56565;
            color: #fff
        }

        .badge.unverified {
            background: #f6ad55;
            color: #fff
        }

        .violations {
            margin-top: 10px;
            padding: 10px;
            background: #fef5e7;
            border-radius: 4px;
            font-size: .9em;
            color: #744210
        }

        .summary {
            background: #2d3748;
            color: #fff;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.2em;
            font-weight: 600
        }

        .summary.ready {
            background: #48bb78
        }

        .summary.fix {
            background: #f56565
        }

        .summary.partial {
            background: #f6ad55
        }

        .hidden {
            display: none
        }

        .progress {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            margin: 10px 0
        }

        .progress-bar {
            height: 100%;
            background: #667eea;
            width: 0%;
            transition: width .3s
        }

        .results {
            background: #f7fafc;
            border-radius: 8px;
            padding: 20px;
            border: 2px solid #e2e8f0
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>🔗 GitHub Scanner</h1>
            <div>Code Olympics 2026 Constraint Checker</div>
        </header>
        <main>
            <div class="grid">
                <div class="section">
                    <h2>🔗 Repository</h2><input id="repoUrl" placeholder="github.com/owner/repo">
                    <p style="margin-top:10px;font-size:.9em;color:#718096">Scans all source files</p>
                </div>
                <div class="section">
                    <h2>🎯 4D Combo</h2>
                    <div class="controls">
                        <div><label>D1</label><select id="d1">
                                <option value="no-import">No-Import</option>
                                <option value="few-var">Few-Variable</option>
                                <option value="single-func">Single-Function</option>
                                <option value="error-proof">Error-Proof</option>
                                <option value="one-loop" selected>One-Loop</option>
                                <option value="short-name">Short-Name</option>
                                <option value="fast-response">Fast-Response</option>
                                <option value="simple-state">Simple-State</option>
                            </select></div>
                        <div><label>D2</label><select id="d2">
                                <option value="50">50</option>
                                <option value="100">100</option>
                                <option value="150">150</option>
                                <option value="200">200</option>
                                <option value="300" selected>300</option>
                                <option value="400">400</option>
                                <option value="500">500</option>
                                <option value="650">650</option>
                            </select></div>
                        <div><label>D3</label><select id="d3">
                                <option value="games">Games</option>
                                <option value="tools">Tools</option>
                                <option value="text">Text</option>
                                <option value="numbers">Numbers</option>
                                <option value="files">Files</option>
                                <option value="quiz">Quiz</option>
                                <option value="visual">Visual</option>
                                <option value="db">Database</option>
                                <option value="data" selected>Data</option>
                                <option value="system">System</option>
                            </select></div>
                        <div><label>D4</label><select id="d4">
                                <option value="python">Python</option>
                                <option value="javascript" selected>JavaScript</option>
                                <option value="typescript">TypeScript</option>
                                <option value="go">Go</option>
                                <option value="rust">Rust</option>
                                <option value="ruby">Ruby</option>
                                <option value="c">C</option>
                                <option value="java">Java</option>
                                <option value="bash">Bash</option>
                                <option value="php">PHP</option>
                            </select></div>
                    </div><button id="scanBtn" onclick="scanRepo()">🔍 Scan</button>
                </div>
            </div>
            <div id="progressBox"></div>
            <div id="resultsSection" class="hidden">
                <div id="summaryBox"></div>
                <div class="results" id="resultsBox"></div>
            </div>
        </main>
    </div>
    <script>const p = { javascript: { loop: /\b(for|while|do)\b/g, func: /\bfunction\b|\=\>|^[a-z_$][\w$]*\s*\(/gm, import: /\b(import|require)\b/g, var: /\b(let|const|var)\s+([a-z_$][\w$]*)/gi }, python: { loop: /\b(for|while)\b/g, func: /\bdef\s+\w+/g, import: /\b(import|from)\b/g, var: /\b([a-z_]\w*)\s*=/gi }, go: { loop: /\bfor\b/g, func: /\bfunc\s+\w+/g, import: /\bimport\b/g, var: /\b(var|:=)\s+([a-z_]\w*)/gi }, rust: { loop: /\b(for|while|loop)\b/g, func: /\bfn\s+\w+/g, import: /\buse\b/g, var: /\blet\s+(mut\s+)?([a-z_]\w*)/gi } }; const langMap = { '.js': 'javascript', '.ts': 'typescript', '.py': 'python', '.go': 'go', '.rs': 'rust', '.rb': 'ruby', '.c': 'c', '.java': 'java', '.sh': 'bash', '.php': 'php', '.html': 'javascript' }; async function scanRepo() { const url = document.getElementById('repoUrl').value; if (!url.trim()) { alert('Enter repo URL!'); return } const m = url.match(/github\.com\/([^\/]+)\/([^\/]+)/); if (!m) { alert('Invalid GitHub URL!'); return } const [, o, r] = m.map(x => x.replace(/\.git$/, '')), d1 = document.getElementById('d1').value, d2 = parseInt(document.getElementById('d2').value), d3 = document.getElementById('d3').value, d4 = document.getElementById('d4').value, btn = document.getElementById('scanBtn'), pb = document.getElementById('progressBox'), rs = document.getElementById('resultsSection'); btn.disabled = true; rs.classList.remove('hidden'); pb.innerHTML = '<div class="progress"><div class="progress-bar" style="width:10%"></div></div>Fetching repository...'; try { let t = await fetch(`https://api.github.com/repos/${o}/${r}/git/trees/main?recursive=1`); if (!t.ok) { t = await fetch(`https://api.github.com/repos/${o}/${r}/git/trees/master?recursive=1`) } if (!t.ok) { throw new Error('Repository not found or branch not accessible') } const tr = await t.json(); if (!tr.tree) { throw new Error('No files found in repository') } const sf = tr.tree.filter(f => f.type === 'blob' && /\.(js|ts|py|go|rs|rb|c|java|sh|php|html)$/.test(f.path)); if (sf.length === 0) { alert('No source files found! Make sure repo has .js, .ts, .py, .go, .rs, .rb, .c, .java, .sh, .php, or .html files.'); pb.innerHTML = '<div style="color:orange">⚠️ No source files found</div>'; btn.disabled = false; return } const fetchFile = async (f, i, total) => { pb.innerHTML = `<div class="progress"><div class="progress-bar" style="width:${Math.round((i + 1) / total * 100)}%"></div></div>Scanning ${i + 1}/${total} files...`; const c = await fetch(`https://api.github.com/repos/${o}/${r}/contents/${f.path}`), ct = await c.json(); return atob(ct.content) + '\n' }, contents = await Promise.all(sf.map((f, i) => fetchFile(f, i, sf.length))), ac = contents.join(''), l = ac.split('\n').filter(x => x.trim()); if (l.length === 0) { alert('All files are empty!'); pb.innerHTML = '<div style="color:orange">⚠️ No code found</div>'; btn.disabled = false; return } const res = runChecks(ac, l, d1, d2, d3, d4, sf); renderResults(res) } catch (e) { alert('Error: ' + e.message); pb.innerHTML = '<div style="color:red">❌ Failed to fetch repository</div>' } btn.disabled = false } function runChecks(code, lines, d1, d2, d3, d4, files) { const pat = p.javascript; const detectedLangs = new Set(files.map(f => { const ext = f.path.match(/\.[^.]+$/); return ext ? langMap[ext[0]] : null }).filter(Boolean)); const langMatch = detectedLangs.has(d4); return [{ name: 'D2 · Line Budget', check: () => { const c = lines.length, p = c <= d2; return { pass: p, msg: p ? `✓ ${c}/${d2}` : `✗ ${c} exceeds ${d2}`, violations: p ? [] : [`Excess: ${c - d2}`] } } }, { name: 'D1 · Core', check: () => { if (d1 === 'one-loop') { const m = code.match(pat.loop) || [], p = m.length <= 1; return { pass: p, msg: p ? `✓ ${m.length} loop(s)` : `✗ ${m.length} loops`, violations: p ? [] : [`Found ${m.length}`] } } if (d1 === 'no-import') { const m = code.match(pat.import) || [], p = m.length === 0; return { pass: p, msg: p ? '✓ No imports' : `✗ ${m.length} imports`, violations: p ? [] : [`Found ${m.length}`] } } if (d1 === 'short-name') { const v = [...code.matchAll(pat.var)].map(m => m[m.length - 1]).filter(x => x && x.length > 3), p = v.length === 0; return { pass: p, msg: p ? '✓ All ≤3' : `✗ ${v.length} long`, violations: p ? [] : [`Found ${v.length}`] } } if (d1 === 'few-var') { const v = new Set([...code.matchAll(pat.var)].map(m => m[m.length - 1])), p = v.size <= 8; return { pass: p, msg: p ? `✓ ${v.size}/8` : `✗ ${v.size} vars`, violations: p ? [] : [`Found ${v.size}`] } } if (d1 === 'single-func') { const f = code.match(pat.func) || [], p = f.length <= 1; return { pass: p, msg: p ? `✓ ${f.length} func` : `✗ ${f.length} funcs`, violations: p ? [] : [`Found ${f.length}`] } } return { pass: true, msg: '✓ OK', violations: [] } } }, { name: 'D3 · Domain', check: () => ({ pass: null, msg: `ℹ️ ${d3.charAt(0).toUpperCase() + d3.slice(1)}`, violations: [] }) }, { name: 'D4 · Language', check: () => { const langs = Array.from(detectedLangs).join(', '); return { pass: langMatch, msg: langMatch ? `✓ ${d4}` : `✗ Found: ${langs}`, violations: langMatch ? [] : [`Expected ${d4}, found ${langs}`] } } }].map(r => ({ ...r, ...r.check() })) } function renderResults(results) { const ap = results.every(r => r.pass === true || r.pass === null), af = results.some(r => r.pass === false), s = document.getElementById('summaryBox'), rb = document.getElementById('resultsBox'); s.className = ap ? 'summary ready' : af ? 'summary fix' : 'summary partial'; s.innerHTML = ap ? '✅ READY' : af ? '❌ FIX' : '⚠ MOSTLY READY'; rb.innerHTML = results.map(r => { const c = r.pass === true ? 'pass' : r.pass === false ? 'fail' : 'unverified', b = r.pass === true ? '✓' : r.pass === false ? '✗' : 'ℹ️'; return `<div class="result-item ${c}"><div class="result-header"><span class="result-title">${r.name}</span><span class="badge ${c}">${b}</span></div><div>${r.msg}</div>${r.violations.length > 0 ? `<div class="violations">${r.violations.join('<br>')}</div>` : ''}</div>` }).join(''); document.getElementById('resultsSection').classList.remove('hidden'); document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth' }) }</script>
</body>

</html>
