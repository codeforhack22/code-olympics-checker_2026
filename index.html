<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Olympics 2026 Constraint Checker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden
        }

        header {
            background: #2d3748;
            color: white;
            padding: 30px;
            text-align: center
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700
        }

        .tagline {
            opacity: 0.9;
            font-size: 1.1em
        }

        main {
            padding: 30px
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px
        }

        @media(max-width:768px) {
            .grid {
                grid-template-columns: 1fr
            }
        }

        .section {
            background: #f7fafc;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #e2e8f0
        }

        .section h2 {
            color: #2d3748;
            margin-bottom: 15px;
            font-size: 1.3em
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            border: 2px solid #cbd5e0;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1)
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px
        }

        label {
            display: block;
            color: #4a5568;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9em
        }

        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
            background: white
        }

        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1)
        }

        .btn-group {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px
        }

        button {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s
        }

        button:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4)
        }

        button:active {
            transform: translateY(0)
        }

        button.secondary {
            background: #48bb78
        }

        button.secondary:hover {
            background: #38a169
        }

        .results {
            background: #f7fafc;
            border-radius: 8px;
            padding: 20px;
            border: 2px solid #e2e8f0
        }

        .result-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 4px solid #cbd5e0
        }

        .result-item.pass {
            border-left-color: #48bb78;
            background: #f0fff4
        }

        .result-item.fail {
            border-left-color: #f56565;
            background: #fff5f5
        }

        .result-item.unverified {
            border-left-color: #f6ad55;
            background: #fffaf0
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px
        }

        .result-title {
            font-weight: 600;
            color: #2d3748
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600
        }

        .badge.pass {
            background: #48bb78;
            color: white
        }

        .badge.fail {
            background: #f56565;
            color: white
        }

        .badge.unverified {
            background: #f6ad55;
            color: white
        }

        .violations {
            margin-top: 10px;
            padding: 10px;
            background: #fef5e7;
            border-radius: 4px;
            font-size: 0.9em;
            color: #744210
        }

        .summary {
            background: #2d3748;
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.2em;
            font-weight: 600
        }

        .summary.ready {
            background: #48bb78
        }

        .summary.fix {
            background: #f56565
        }

        .summary.partial {
            background: #f6ad55
        }

        .hidden {
            display: none
        }

        .meta {
            text-align: center;
            padding: 20px;
            color: #718096;
            font-size: 0.9em;
            border-top: 2px solid #e2e8f0
        }

        .link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600
        }

        .link:hover {
            text-decoration: underline
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>🏆 Code Olympics 2026</h1>
            <div class="tagline">Constraint Checker — Paste Code (Updated)</div>
        </header>
        <main>
            <div class="grid">
                <div class="section">
                    <h2>📝 Your Code</h2><textarea id="codeInput" placeholder="Paste your code here..."></textarea>
                </div>
                <div class="section">
                    <h2>🎯 Your 4D Combo</h2>
                    <div class="controls">
                        <div><label>D1</label><select id="d1">
                                <option value="no-import">No-Import Rookie</option>
                                <option value="few-var">Few-Variable Hero</option>
                                <option value="single-func">Single-Function Master</option>
                                <option value="error-proof">Error-Proof Coder</option>
                                <option value="one-loop" selected>One-Loop Warrior</option>
                                <option value="short-name">Short-Name Ninja</option>
                                <option value="fast-response">Fast-Response Builder</option>
                                <option value="simple-state">Simple-State Creator</option>
                            </select></div>
                        <div><label>D2</label><select id="d2">
                                <option value="50">50</option>
                                <option value="100">100</option>
                                <option value="150">150</option>
                                <option value="200">200</option>
                                <option value="300" selected>300</option>
                                <option value="400">400</option>
                                <option value="500">500</option>
                                <option value="650">650</option>
                            </select></div>
                        <div><label>D3</label><select id="d3">
                                <option value="data" selected>Data Processing</option>
                            </select></div>
                        <div><label>D4</label><select id="d4">
                                <option value="javascript" selected>JavaScript</option>
                            </select></div>
                    </div>
                    <div class="btn-group"><button onclick="checkConstraints()">🔍 Check</button><button
                            class="secondary" onclick="validateSelf()">🎯 Self</button></div>
                </div>
            </div>
            <div id="resultsSection" class="hidden">
                <div id="summaryBox"></div>
                <div class="results" id="resultsBox"></div>
            </div>
            <div class="meta">✨ All 4D constraints validated • Automated • Real-time | <a class="link"
                    href="github-scanner.html">🔗 Scan GitHub Repos</a></div>
        </main>
    </div>
    <script>const p = { javascript: { loop: /\b(for|while|do)\b/g, func: /\bfunction\b|\=\>|^[a-z_$][\w$]*\s*\(/gm, import: /\b(import|require)\b/g, var: /\b(let|const|var)\s+([a-z_$][\w$]*)/gi }, python: { loop: /\b(for|while)\b/g, func: /\bdef\s+\w+/g, import: /\b(import|from)\b/g, var: /\b([a-z_]\w*)\s*=/gi }, go: { loop: /\bfor\b/g, func: /\bfunc\s+\w+/g, import: /\bimport\b/g, var: /\b(var|:=)\s+([a-z_]\w*)/gi }, rust: { loop: /\b(for|while|loop)\b/g, func: /\bfn\s+\w+/g, import: /\buse\b/g, var: /\blet\s+(mut\s+)?([a-z_]\w*)/gi } }; function validateSelf() { fetch(window.location.href).then(r => r.text()).then(html => { document.getElementById('codeInput').value = html; checkConstraints() }) } function checkConstraints() { const code = document.getElementById('codeInput').value; if (!code.trim()) { alert('Paste code first!'); return } const d1 = document.getElementById('d1').value, d2 = parseInt(document.getElementById('d2').value), lines = code.split('\n').filter(l => l.trim()), pat = p['javascript'], results = runChecks(code, lines, d1, d2, pat); renderResults(results) } function runChecks(code, lines, d1, d2, pat) { return [{ name: 'D2 · Line Budget', check: () => { const c = lines.length, p = c <= d2; return { pass: p, msg: p ? `✓ ${c}/${d2}` : `✗ ${c} exceeds ${d2}`, violations: p ? [] : [`Excess: ${c - d2}`] } } }, { name: 'D1 · Core', check: () => { if (d1 === 'one-loop') { const m = code.match(pat.loop) || [], p = m.length <= 1; return { pass: p, msg: p ? `✓ ${m.length} loop(s)` : `✗ ${m.length} loops`, violations: p ? [] : [`Found ${m.length}`] } } if (d1 === 'no-import') { const m = code.match(pat.import) || [], p = m.length === 0; return { pass: p, msg: p ? '✓ No imports' : `✗ ${m.length} imports`, violations: p ? [] : [`Found ${m.length}`] } } if (d1 === 'short-name') { const v = [...code.matchAll(pat.var)].map(m => m[m.length - 1]).filter(x => x && x.length > 3), p = v.length === 0; return { pass: p, msg: p ? '✓ All ≤3' : `✗ ${v.length} long`, violations: p ? [] : [`Found ${v.length}`] } } if (d1 === 'few-var') { const v = new Set([...code.matchAll(pat.var)].map(m => m[m.length - 1])), p = v.size <= 8; return { pass: p, msg: p ? `✓ ${v.size}/8` : `✗ ${v.size} vars`, violations: p ? [] : [`Found ${v.size}`] } } if (d1 === 'single-func') { const f = code.match(pat.func) || [], p = f.length <= 1; return { pass: p, msg: p ? `✓ ${f.length} func` : `✗ ${f.length} funcs`, violations: p ? [] : [`Found ${f.length}`] } } return { pass: true, msg: '✓ OK', violations: [] } } }, { name: 'D3 · Domain', check: () => { return { pass: true, msg: 'ℹ️ Data Processing', violations: [] } } }, { name: 'D4 · Language', check: () => { return { pass: true, msg: '✅ JavaScript', violations: [] } } }].map(r => ({ ...r, ...r.check() })) } function renderResults(results) { const ap = results.every(r => r.pass === true), af = results.some(r => r.pass === false), s = document.getElementById('summaryBox'), rb = document.getElementById('resultsBox'); s.className = ap ? 'summary ready' : af ? 'summary fix' : 'summary partial'; s.innerHTML = ap ? '✅ READY' : af ? '❌ FIX' : '⚠ MOSTLY READY'; rb.innerHTML = results.map(r => { const c = r.pass === true ? 'pass' : r.pass === false ? 'fail' : 'unverified'; const b = r.pass === true ? '✓' : r.pass === false ? '✗' : '⚠'; return `<div class="result-item ${c}"><div class="result-header"><span class="result-title">${r.name}</span><span class="badge ${c}">${b}</span></div><div>${r.msg}</div>${r.violations.length > 0 ? `<div class="violations">${r.violations.join('<br>')}</div>` : ''}</div>` }).join(''); document.getElementById('resultsSection').classList.remove('hidden'); document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth' }) }</script>
</body>

</html>
