<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Olympics 2026 Constraint Checker — Best Version</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden
        }

        header {
            background: #2d3748;
            color: white;
            padding: 30px;
            text-align: center
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700
        }

        .tagline {
            opacity: 0.9;
            font-size: 1.1em
        }

        main {
            padding: 30px
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px
        }

        @media(max-width:768px) {
            .grid {
                grid-template-columns: 1fr
            }
        }

        .section {
            background: #f7fafc;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #e2e8f0
        }

        .section h2 {
            color: #2d3748;
            margin-bottom: 15px;
            font-size: 1.3em
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            border: 2px solid #cbd5e0;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.3s
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1)
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px
        }

        label {
            display: block;
            color: #4a5568;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9em
        }

        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            transition: border-color 0.3s
        }

        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1)
        }

        .btn-group {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px
        }

        button {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s
        }

        button:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4)
        }

        button:active {
            transform: translateY(0)
        }

        button.secondary {
            background: #48bb78;
            font-size: 0.95em
        }

        button.secondary:hover {
            background: #38a169
        }

        .results {
            background: #f7fafc;
            border-radius: 8px;
            padding: 20px;
            border: 2px solid #e2e8f0
        }

        .result-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 4px solid #cbd5e0;
            transition: all 0.3s
        }

        .result-item:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1)
        }

        .result-item.pass {
            border-left-color: #48bb78;
            background: #f0fff4
        }

        .result-item.fail {
            border-left-color: #f56565;
            background: #fff5f5
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px
        }

        .result-title {
            font-weight: 600;
            color: #2d3748
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600
        }

        .badge.pass {
            background: #48bb78;
            color: white
        }

        .badge.fail {
            background: #f56565;
            color: white
        }

        .violations {
            margin-top: 10px;
            padding: 10px;
            background: #fef5e7;
            border-radius: 4px;
            font-size: 0.9em;
            color: #744210
        }

        .summary {
            background: #2d3748;
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.2em;
            font-weight: 600
        }

        .summary.ready {
            background: #48bb78
        }

        .summary.fix {
            background: #f56565
        }

        .hidden {
            display: none
        }

        .meta {
            text-align: center;
            padding: 20px;
            color: #718096;
            font-size: 0.9em;
            border-top: 2px solid #e2e8f0
        }

        .examples {
            margin-top: 15px;
            padding: 10px;
            background: #edf2f7;
            border-radius: 6px;
            font-size: 0.85em
        }

        .examples summary {
            cursor: pointer;
            font-weight: 600;
            color: #4a5568;
            padding: 5px
        }

        .examples pre {
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
            cursor: pointer
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>🏆 Code Olympics 2026</h1>
            <div class="tagline">Constraint Checker — The Best Version</div>
        </header>
        <main>
            <div class="grid">
                <div class="section">
                    <h2>📝 Your Code</h2><textarea id="codeInput" placeholder="Paste your code here..."></textarea>
                    <details class="examples">
                        <summary>💡 Try Example</summary>
                        <pre onclick="loadExample(this.textContent)">function greet(name) {
  return `Hello, ${name}!`;
}
console.log(greet("World"));</pre>
                    </details>
                </div>
                <div class="section">
                    <h2>🎯 Your 4D Combo</h2>
                    <div class="controls">
                        <div><label>D1 · Core Constraint</label><select id="d1">
                                <option value="no-import">No-Import Rookie</option>
                                <option value="few-var">Few-Variable Hero (≤8)</option>
                                <option value="single-func">Single-Function Master</option>
                                <option value="error-proof">Error-Proof Coder</option>
                                <option value="one-loop" selected>One-Loop Warrior</option>
                                <option value="short-name">Short-Name Ninja (≤3)</option>
                                <option value="fast-response">Fast-Response Builder</option>
                                <option value="simple-state">Simple-State Creator (2-3)</option>
                            </select></div>
                        <div><label>D2 · Line Budget</label><select id="d2">
                                <option value="50">Tiny Scripter (50)</option>
                                <option value="100">Mini Builder (100)</option>
                                <option value="150">Compact Coder (150)</option>
                                <option value="200">Standard Maker (200)</option>
                                <option value="300" selected>Detailed Creator (300)</option>
                                <option value="400">Feature-Rich Dev (400)</option>
                                <option value="500">Professional Builder (500)</option>
                                <option value="650">Enterprise Creator (650)</option>
                            </select></div>
                        <div><label>D3 · Project Domain</label><select id="d3">
                                <option value="games">Simple Games</option>
                                <option value="tools">Basic Tools</option>
                                <option value="text">Text Processing</option>
                                <option value="number">Number Crunching</option>
                                <option value="file">File Management</option>
                                <option value="quiz">Quiz Systems</option>
                                <option value="visual">Visual Creation</option>
                                <option value="database">Mini Databases</option>
                                <option value="data" selected>Data Processing</option>
                                <option value="system">System Utilities</option>
                            </select></div>
                        <div><label>D4 · Language</label><select id="d4">
                                <option value="python">Python</option>
                                <option value="javascript" selected>JavaScript</option>
                                <option value="typescript">TypeScript</option>
                                <option value="go">Go</option>
                                <option value="rust">Rust</option>
                                <option value="ruby">Ruby</option>
                                <option value="c">C</option>
                                <option value="java">Java</option>
                                <option value="bash">Bash</option>
                                <option value="php">PHP</option>
                            </select></div>
                    </div>
                    <div class="btn-group"><button onclick="checkConstraints()">🔍 Check Constraints</button><button
                            class="secondary" onclick="validateSelf()">🎯 Validate Self</button></div>
                </div>
            </div>
            <div id="resultsSection" class="hidden">
                <div id="summaryBox"></div>
                <div class="results" id="resultsBox"></div>
            </div>
            <div class="meta">✨ Enhanced: Better UX + percentage display + smooth scroll + self-validation + example
                code</div>
        </main>
    </div>
    <script>const patterns = { javascript: { loop: /\b(for|while|do)\b/g, func: /\bfunction\b|\=\>|^[a-z_$][\w$]*\s*\(/gm, import: /\b(import|require)\b/g, var: /\b(let|const|var)\s+([a-z_$][\w$]*)/gi }, python: { loop: /\b(for|while)\b/g, func: /\bdef\s+\w+/g, import: /\b(import|from)\b/g, var: /\b([a-z_]\w*)\s*=/gi }, typescript: { loop: /\b(for|while|do)\b/g, func: /\bfunction\b|\=\>|^[a-z_$][\w$]*\s*\(/gm, import: /\b(import|require|from)\b/g, var: /\b(let|const|var)\s+([a-z_$][\w$]*)/gi }, go: { loop: /\bfor\b/g, func: /\bfunc\s+\w+/g, import: /\bimport\b/g, var: /\b(var|:=)\s+([a-z_]\w*)/gi }, rust: { loop: /\b(for|while|loop)\b/g, func: /\bfn\s+\w+/g, import: /\buse\b/g, var: /\blet\s+(mut\s+)?([a-z_]\w*)/gi }, ruby: { loop: /\b(for|while|loop|each)\b/g, func: /\bdef\s+\w+/g, import: /\brequire\b/g, var: /\b([a-z_]\w*)\s*=/gi }, c: { loop: /\b(for|while|do)\b/g, func: /\b\w+\s+\w+\s*\(/g, import: /#include/g, var: /\b(int|char|float|double|long|short)\s+([a-z_]\w*)/gi }, java: { loop: /\b(for|while|do)\b/g, func: /\b(public|private|protected)?\s*(static)?\s*\w+\s+\w+\s*\(/g, import: /\bimport\b/g, var: /\b(int|String|boolean|double|float|long|char)\s+([a-z_]\w*)/gi }, bash: { loop: /\b(for|while|until)\b/g, func: /\bfunction\s+\w+|\w+\s*\(\)/g, import: /\bsource\b|\./g, var: /\b([a-z_]\w*)=/gi }, php: { loop: /\b(for|while|foreach|do)\b/g, func: /\bfunction\s+\w+/g, import: /\b(require|include)\b/g, var: /\$([a-z_]\w*)/gi } }; function loadExample(code) { document.getElementById('codeInput').value = code.trim() } function validateSelf() { fetch(window.location.href).then(r => r.text()).then(html => { document.getElementById('codeInput').value = html; document.getElementById('d1').value = 'one-loop'; document.getElementById('d2').value = '300'; document.getElementById('d3').value = 'data'; document.getElementById('d4').value = 'javascript'; checkConstraints() }) } function checkConstraints() { const code = document.getElementById('codeInput').value; if (!code.trim()) { alert('⚠️ Please paste your code first!'); return } const d1 = document.getElementById('d1').value, d2 = parseInt(document.getElementById('d2').value), lang = document.getElementById('d4').value, lines = code.split('\n').filter(l => l.trim()), p = patterns[lang] || patterns.javascript, results = [{ name: 'D2 · Line Budget', check: () => { const count = lines.length, pass = count <= d2, pct = Math.round(count / d2 * 100); return { pass, msg: pass ? `✓ ${count}/${d2} lines (${pct}% used)` : `✗ ${count} lines exceeds ${d2} (${pct}%)`, violations: pass ? [] : [`Total: ${count}, Budget: ${d2}, Excess: ${count - d2}`] } } }, { name: 'D1 · Core Constraint', check: () => { if (d1 === 'no-import') { const matches = code.match(p.import) || [], pass = matches.length === 0; return { pass, msg: pass ? '✓ No imports found' : `✗ Found ${matches.length} import(s)`, violations: matches.map((m, i) => `Import ${i + 1}: "${m}"`) } } if (d1 === 'one-loop') { const matches = code.match(p.loop) || [], pass = matches.length <= 1; return { pass, msg: pass ? `✓ ${matches.length} loop(s) (max: 1)` : `✗ Found ${matches.length} loops (max: 1)`, violations: matches.slice(1).map((m, i) => `Extra loop ${i + 1}: "${m}"`) } } if (d1 === 'short-name') { const vars = [...code.matchAll(p.var)].map(m => m[m.length - 1]).filter(v => v && v.length > 3), pass = vars.length === 0; return { pass, msg: pass ? '✓ All names ≤3 chars' : `✗ ${vars.length} name(s) exceed 3 chars`, violations: vars.slice(0, 10).map(v => `"${v}" (${v.length} chars)`) } } if (d1 === 'few-var') { const vars = new Set([...code.matchAll(p.var)].map(m => m[m.length - 1])), pass = vars.size <= 8; return { pass, msg: pass ? `✓ ${vars.size}/8 variables` : `✗ ${vars.size} variables (max: 8)`, violations: vars.size > 8 ? [`Found ${vars.size} unique (${vars.size - 8} over)`] : [] } } if (d1 === 'single-func') { const funcs = code.match(p.func) || [], pass = funcs.length <= 1; return { pass, msg: pass ? `✓ ${funcs.length} function(s) (max: 1)` : `✗ Found ${funcs.length} functions (max: 1)`, violations: funcs.slice(1, 6).map((f, i) => `Extra ${i + 1}: "${f.substring(0, 40)}..."`) } } return { pass: true, msg: '⚠ Manual check required', violations: ['Requires manual verification'] } } }].map(r => ({ ...r, ...r.check() })); const allPass = results.every(r => r.pass), summary = document.getElementById('summaryBox'), resultsBox = document.getElementById('resultsBox'); summary.className = allPass ? 'summary ready' : 'summary fix'; summary.innerHTML = allPass ? '✅ SUBMISSION READY — All constraints satisfied!' : '❌ FIX REQUIRED — See violations below'; resultsBox.innerHTML = results.map(r => `<div class="result-item ${r.pass ? 'pass' : 'fail'}"><div class="result-header"><span class="result-title">${r.name}</span><span class="badge ${r.pass ? 'pass' : 'fail'}">${r.pass ? 'PASS' : 'FAIL'}</span></div><div>${r.msg}</div>${r.violations.length > 0 ? `<div class="violations"><strong>Violations:</strong><br>${r.violations.join('<br>')}</div>` : ''}</div>`).join(''); document.getElementById('resultsSection').classList.remove('hidden'); document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth' }) }</script>
</body>

</html>
